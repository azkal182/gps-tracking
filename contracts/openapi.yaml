  responses:
    BadRequest:
      description: Malformed JSON, malformed query parameter, or unreadable request.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/BadRequest'
    Unauthorized:
      description: Credential missing, expired, revoked or invalid.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/Unauthorized'
    Forbidden:
      description: Principal lacks scope, membership, object grant, recent authentication or valid CSRF/Origin.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/Forbidden'
    NotFound:
      description: Resource is missing or hidden because it belongs to another tenant/object scope.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/NotFound'
    Conflict:
      description: Resource uniqueness/session constraint or idempotency key/body conflict.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            session:
              '$ref': '#/components/examples/SessionConflict'
            idempotency:
              '$ref': '#/components/examples/IdempotencyConflict'
    PayloadTooLarge:
      description: Request body exceeds the configured endpoint byte limit.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/PayloadTooLarge'
    ValidationError:
      description: Request violates structural or business validation constraints.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/ValidationError'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
        Retry-After:
          '$ref': '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/RateLimited'
    InternalServerError:
      description: Internal error; response must not disclose secrets, coordinates or internal stack traces.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/InternalError'
    ServiceUnavailable:
      description: Required dependency is unavailable or the service is not ready.
      headers:
        X-Request-Id:
          '$ref': '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            '$ref': '#/components/schemas/ErrorEnvelope'
          examples:
            error:
              '$ref': '#/components/examples/ServiceUnavailable'
