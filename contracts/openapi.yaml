      type: string
      enum:
        - active
        - inactive
      description: Active if the target has an active tracking session; otherwise inactive.
    SessionStatus:
      type: string
      enum:
        - active
        - ended
      description: Derived from ended_at being null or set.
    ConnectivityStatus:
      type: string
      enum:
        - online
        - offline
        - unknown
      description: >-
        Derived from last successful credentialed contact; online when age is less than 180 seconds, offline at or beyond
        180 seconds, and unknown before first contact. Configurable; it does not assert GPS fix or socket connectivity.
    PositionStatus:
      type: string
      enum:
        - fresh
        - stale
        - no_position
      description: >-
        Derived independently from connectivity and based on the last displayed position's recorded_at; fresh under 60 seconds,
        stale at or beyond 60 seconds, no_position if no eligible position exists. Configurable.
